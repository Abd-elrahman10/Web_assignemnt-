<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Online Library</title>
    <link rel="stylesheet" href="CSS/main.css">
</head>
<body>
    <div class="container">
        <h1>Add Book</h1>
        <p class="subtitle">Enter the information below to add a new book</p>
        
        <form method="post">
            <input type="text" id="id" placeholder="ID" required na="id">

            <input type="text" id="book-name" placeholder="Book name" required name="book-name">
        
            <input type="text" id="author" placeholder="Auther" required name="author">

            <input type="text" id="category" placeholder="Category" required name="category">

            <textarea id="description" placeholder="Description" required name="description"></textarea>
        
            <button type="submit" class="button">Add</button>
        </form>
    </div>
</body>
</html>
