<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="Sign_Up.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
</head>
<body>
  <div class="logo">
    <a id="logo" data-text="Booker" href="#">
        <span class="logo-icon"><i class="fas fa-book"></i></span>
        <span class="logo-text">Booker</span>
    </a>
</div>
  <div class="Sign_UP">
    <h1>Sign Up</h1>
    <form>
      <label for="user_fname">First Name</label>
      <input type="text" name="user_fname" placeholder="First Name">
      
      <label for="user_lname">Last Name</label>
      <input type="text" name="user_lname" placeholder="Last Name">
      
      <label for="email">E-mail:</label>
      <input type="email" name="user_email" placeholder="Enter your email">
      
      <label for="password">Password</label>
      <input type="password" name="user_pass" placeholder="Enter your password">
      
      <label for="password">Confirm Password</label>
      <input type="password" name="user_cpass" placeholder="Enter your password">

      <!-- Radio buttons for Admin and User -->
      <div class="radio-group">
        <label>
          <input type="radio" name="role" value="admin">
          Admin
        </label>
        <label>
          <input type="radio" name="role" value="user">
          User
        </label>
      </div>

      <button class="butt" type="submit" >Sign Up </button>
    </form>
  </div>

</body>
</html>
